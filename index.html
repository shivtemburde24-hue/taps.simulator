<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Taps Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one 2:1 landscape stage, letterboxed; DOM menus and touch buttons sit on top of a canvas. */
:root{--sky:#5ec8ff;--ink:#2a1a4a;--sun:#ffd23f;--grass:#4cc552;--berry:#ff4f7b;--cream:#fff6e0;
--disp:'Lilita One','Arial Rounded MT Bold',Impact,sans-serif;--body:'Nunito','Trebuchet MS',sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1033;color:var(--cream);font-family:var(--body);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;border-radius:calc(var(--u)*10);box-shadow:0 0 0 calc(var(--u)*3) #000,0 10px 40px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scr.on{display:flex}
.title{font-family:var(--disp);color:var(--sun);font-size:calc(var(--u)*76);line-height:.95;letter-spacing:calc(var(--u)*2);
-webkit-text-stroke:calc(var(--u)*5) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*7) 0 var(--ink);transform:rotate(-3deg);margin:0}
.title span{display:block;color:#fff;font-size:calc(var(--u)*50)}
.sub{font-weight:900;font-size:calc(var(--u)*15);margin:calc(var(--u)*12) 0 calc(var(--u)*18);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 8px var(--ink)}
.btn{font-family:var(--disp);font-size:calc(var(--u)*30);color:#fff;background:var(--berry);border:calc(var(--u)*4) solid var(--ink);
border-radius:calc(var(--u)*18);padding:calc(var(--u)*6) calc(var(--u)*42);box-shadow:0 calc(var(--u)*6) 0 var(--ink);cursor:pointer;text-shadow:0 2px 0 var(--ink);touch-action:manipulation}
.btn:active{transform:translateY(calc(var(--u)*5));box-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.btn.sm{font-size:calc(var(--u)*18);padding:calc(var(--u)*4) calc(var(--u)*22);background:#3aa7ff;margin-top:calc(var(--u)*10)}
h2{font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*34);margin:0 0 calc(var(--u)*8);color:var(--sun);-webkit-text-stroke:calc(var(--u)*4) var(--ink);paint-order:stroke fill}
#select{background:radial-gradient(circle at 50% 30%,#7a3cff,#2a1a4a 75%)}
#cards{display:flex;gap:calc(var(--u)*12)}
.card{width:calc(var(--u)*150);background:var(--cream);color:var(--ink);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*16);
padding:calc(var(--u)*8);box-shadow:0 calc(var(--u)*6) 0 #0007;cursor:pointer;touch-action:manipulation;transition:transform .12s}
.card:active,.card.pick{transform:translateY(calc(var(--u)*-6)) rotate(-2deg)}
.card img{width:calc(var(--u)*76);height:calc(var(--u)*76);border-radius:50%;border:calc(var(--u)*3) solid var(--ink);display:block;margin:0 auto calc(var(--u)*4)}
.card b{display:block;font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*24)}
.card i{display:block;font-style:normal;font-weight:900;font-size:calc(var(--u)*12);line-height:1.25}
.tag{display:inline-block;margin-top:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*8);border-radius:99px;color:#fff;font-size:calc(var(--u)*11);font-weight:900}
#over,#clear,#intro,#pause{background:#140a2ccc}
#intro img{width:calc(var(--u)*90);height:calc(var(--u)*90);border-radius:50%;border:calc(var(--u)*4) solid var(--ink)}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;display:none}
#hud.on{display:block}
.hp{position:absolute;top:calc(var(--u)*8);display:flex;align-items:center;gap:calc(var(--u)*6);font-family:var(--disp);font-size:calc(var(--u)*16);text-shadow:0 2px 0 var(--ink)}
.hp img{width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;border:calc(var(--u)*3) solid var(--ink);background:#fff}
.bar{width:calc(var(--u)*160);height:calc(var(--u)*16);background:#0008;border:calc(var(--u)*3) solid var(--ink);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:100%;transition:width .15s}
#hp1{left:calc(var(--u)*10)} #hp1 .bar div{background:linear-gradient(#7dff6a,#2bbb3c)}
#hp2{right:calc(var(--u)*10);flex-direction:row-reverse;display:none} #hp2 .bar div{background:linear-gradient(#ff7a7a,#d11f3a);margin-left:auto}
#info{position:absolute;top:calc(var(--u)*8);left:50%;transform:translateX(-50%);font-family:var(--disp);font-size:calc(var(--u)*16);text-shadow:0 2px 0 var(--ink);text-align:center;white-space:nowrap}
#pbtn{position:absolute;top:calc(var(--u)*34);left:50%;transform:translateX(-50%);pointer-events:auto;display:none;font-family:var(--disp);font-size:calc(var(--u)*14);
background:#0006;color:#fff;border:2px solid #fff6;border-radius:99px;padding:0 calc(var(--u)*12)}
#ctl{position:absolute;inset:0;display:none;pointer-events:none}
#ctl.on{display:block}
.cb{position:absolute;bottom:calc(var(--u)*14);width:calc(var(--u)*78);height:calc(var(--u)*78);border-radius:50%;pointer-events:auto;touch-action:none;
display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:calc(var(--u)*34);color:#fff;
background:#ffffff33;border:calc(var(--u)*4) solid #ffffffaa;box-shadow:0 calc(var(--u)*5) 0 #0006;backdrop-filter:blur(2px)}
.cb.dn{background:#ffffff77;transform:scale(.92)}
#bl{left:calc(var(--u)*14)} #br{left:calc(var(--u)*104)}
#bj{right:calc(var(--u)*104);background:#3aa7ff66} #ba{right:calc(var(--u)*14);width:calc(var(--u)*88);height:calc(var(--u)*88);background:#ff4f7b77;font-size:calc(var(--u)*22)}
#rot{position:fixed;inset:0;background:#1b1033;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;font-family:var(--disp);font-size:24px;text-align:center;color:var(--sun);padding:20px}
#rot b{font-size:64px;display:block;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){#rot b{animation:none}}
</style>
</head><body>

<script>
/* stop pinch / double-tap zoom on phones */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
  var last=0;
  document.addEventListener('touchend',function(e){var t=Date.now();if(t-last<350)e.preventDefault();last=t;},{passive:false});
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault();});
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>


<div id="rot"><b>&#x1F4F1;</b>Rotate your phone sideways to play Taps Simulator</div>
<div id="wrap"><div id="stage" style="--u:1px">
<canvas id="cv"></canvas>

<div id="hud">

 <div class="hp" id="hp2"><img id="bface" alt=""><div class="bar"><div id="bbar"></div></div><span id="bname"></span></div>

</div>

<div id="ctl">
 <div class="cb" id="bl">&#9664;</div><div class="cb" id="br">&#9654;</div>
 <div class="cb" id="bj">JUMP</div><div class="cb" id="ba">SHOOT</div>
</div>

<div class="scr on" id="menu">
 <h1 class="title">TAPS<span>SIMULATOR</span></h1>
 <p class="sub">3 worlds. 3 bosses. 1 very silly hero.</p>
 <button class="btn" id="start">START</button>
</div>

<div class="scr" id="select">
 <h2>Choose your hero</h2>
 <div id="cards"></div>
 <button class="btn sm" id="back">BACK</button>
</div>

<div class="scr" id="intro"><div id="introin"></div></div>
<div class="scr" id="pause"><h2>Paused</h2><button class="btn" id="resume">RESUME</button><button class="btn sm" id="quit">MAIN MENU</button></div>
<div class="scr" id="over"><h2 id="overt">Oops!</h2><p class="sub" id="overs"></p><button class="btn" id="again">TRY AGAIN</button><button class="btn sm" id="quit2">MAIN MENU</button></div>
<div class="scr" id="clear"><h2 id="clrt">Stage clear!</h2><p class="sub" id="clrs"></p><button class="btn" id="next">NEXT STAGE</button></div>
</div></div>

function fit() {
  const vw = innerWidth, vh = innerHeight;
  let w = Math.min(vw, vh * 2), h = w / 2;
  if (h > vh) { h = vh; w = h * 2; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', (w / 800) + 'px');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}

const key = { l: 0, r: 0, j: 0, a: 0 };

addEventListener('keydown', e => { const k = kmap[e.code]; if (k) { key[k] = 1; e.preventDefault(); } if (e.code === 'Escape') pauseGame(); });
addEventListener('keyup', e => { const k = kmap[e.code]; if (k) key[k] = 0; });
[['bl', 'l'], ['br', 'r'], ['bj', 'j'], ['ba', 'a']].forEach(([id, k]) => {
  const el = $(id);
  const down = e => { e.preventDefault(); key[k] = 1; el.classList.add('dn'); try { el.setPointerCapture(e.pointerId); } catch (_) {} initAudio(); };
  const up = e => { e.preventDefault(); key[k] = 0; el.classList.remove('dn'); };

  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, up));
  el.addEventListener('contextmenu', e => e.preventDefault());
});

/* audio */
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function beep(f, d, type, vol, slide) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (_) {}
}

/* drawing helpers */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function outline(w) { ctx.lineWidth = w || 3; ctx.strokeStyle = '#2a1a4a'; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function fillStroke(c, w) { ctx.fillStyle = c; ctx.fill(); outline(w); ctx.stroke(); }
function face(img, cx, cy, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.closePath(); ctx.fillStyle = '#fbe6cf'; ctx.fill();
  ctx.clip(); if (img && img.complete && img.naturalWidth) ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); outline(3.5); ctx.stroke();
}

    ctx.strokeStyle = '#ff2a4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, Math.sin(t * .5) * 6 + 1); ctx.lineTo(17, Math.sin(t * .5) * 6 + 1); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(22, 0); ctx.lineTo(10, 6); ctx.closePath(); fillStroke('#cfd6e4', 2.5);
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-30, -6); ctx.lineTo(-18, 0); ctx.lineTo(-30, 6); ctx.closePath(); fillStroke('#ff4f4f', 2);

/* ===== Levels and game logic ===== */
const ARENA = 2800;
function buildLevel(si) {
  const segs = [
    [[0, 520], [630, 1000], [1100, 1450], [1560, 1900], [2000, 2300], [2400, 3500]],
    [[0, 430], [540, 800], [900, 1250], [1360, 1650], [1760, 2100], [2210, 2450], [2560, 3500]],
    [[0, 500], [690, 1000], [1200, 1500], [1700, 2000], [2180, 2450], [2600, 3500]]][si];
  const L = { len: 3500, wall: 2700, segs, gaps: [], solids: [], plats: [], spikes: [], enemies: [], turrets: [], coins: [], picks: [] };
  segs.forEach((s, i) => { L.solids.push({ x: s[0], y: GY, w: s[1] - s[0], h: 120, ground: 1 }); if (i) L.gaps.push([segs[i - 1][1], s[0]]); });
  const box = (x, y, w, h) => L.solids.push({ x, y, w, h, box: 1 });
  const crate = (x, n) => { for (let i = 0; i < (n || 1); i++) box(x, GY - 40 * (i + 1), 40, 40); };
  const walker = (x, y) => L.enemies.push({ kind: 'walker', x, y: y || GY, w: 30, h: 34, vx: 0, vy: 0, dir: -1, hp: 1 });
  const flyer = (x, y) => L.enemies.push({ kind: 'fly', x, y, y0: y, x0: x, w: 36, h: 22, dir: -1, hp: 1, ph: Math.random() * 6 });
  if (si === 0) {
    crate(300, 1); crate(760, 1); crate(1250, 2); crate(1700, 1); crate(2120, 1);
    [[420, 245, 120], [1150, 240, 120], [1620, 250, 100], [2050, 235, 120]].forEach(p => L.plats.push({ x: p[0], y: p[1], w: p[2] }));
    [[850, 44], [1330, 40], [1780, 44], [2200, 40]].forEach(s => L.spikes.push({ x: s[0], y: GY - 20, w: s[1], h: 20 }));
    [450, 850, 1300, 1750, 2150].forEach(x => walker(x));
    [[950, 200], [1500, 190], [2250, 200]].forEach(f => flyer(f[0], f[1]));
  } else if (si === 1) {
    crate(330, 1); crate(1000, 2); crate(1520, 1); crate(1960, 1);
    [[600, 245, 100], [1280, 235, 100], [1700, 245, 100], [2300, 240, 110]].forEach(p => L.plats.push({ x: p[0], y: p[1], w: p[2] }));
    [[480, 40], [1100, 44], [1860, 44]].forEach(s => L.spikes.push({ x: s[0], y: GY - 20, w: s[1], h: 20 }));
    [[740, 1], [1190, 1], [1600, 1], [2050, 1], [2400, 1]].forEach(t => { L.solids.push({ x: t[0], y: GY - 60, w: 40, h: 60, box: 1, turret: 1 }); L.turrets.push({ x: t[0] + 4, y: GY - 34, dir: -1, per: 120, t: Math.floor(Math.random() * 100), type: 'arrow' }); });
    [450, 700, 1000, 1450, 1900, 2300].forEach(x => walker(x));
    [[880, 190], [1700, 180]].forEach(f => flyer(f[0], f[1]));
  } else {
    crate(280, 1); crate(1100, 2); crate(1350, 1); crate(1850, 1); crate(2330, 1);
    [[560, 200, 110], [1020, 180, 110], [1550, 190, 110], [2050, 175, 110], [2500, 200, 100]].forEach(p => L.plats.push({ x: p[0], y: p[1], w: p[2] }));
    [[820, 44], [1250, 40], [1800, 44]].forEach(s => L.spikes.push({ x: s[0], y: GY - 20, w: s[1], h: 20 }));
    [900, 1450, 1900, 2380].forEach(x => { L.solids.push({ x, y: GY - 50, w: 36, h: 50, box: 1, turret: 1 }); L.turrets.push({ x: x + 4, y: GY - 28, dir: -1, per: 100, t: Math.floor(Math.random() * 90), type: 'laser' }); });
    [400, 800, 1300, 1700, 2250].forEach(x => walker(x));
    [[700, 160], [1200, 150], [1650, 150], [2150, 140]].forEach(f => flyer(f[0], f[1]));
  }
  // coins on ground and across gaps
  segs.forEach(s => { for (let x = s[0] + 80; x < Math.min(s[1] - 40, ARENA - 100); x += 110) L.coins.push({ x, y: GY - 36 }); });
  L.gaps.forEach(g => { const m = (g[0] + g[1]) / 2, hh = si === 2 ? 130 : 80; for (let i = -1; i <= 1; i++) L.coins.push({ x: m + i * 34, y: GY - 60 - hh * (1 - i * i * .55) }); });
  L.plats.forEach(p => L.coins.push({ x: p.x + p.w / 2, y: p.y - 26 }));
  [750, 1600, 2300].forEach(x => L.picks.push({ x, y: GY - 40 }));
  return L;
}

let G = null; // game state
function newGame(ci, si) {
  const C = CHARS[ci], S = STAGES[si], L = buildLevel(si);
  const bossHp = [120, 180, 260][si];
  G = { ci, si, C, S, L, t: 0, cam: 0, shake: 0, score: G ? G.score : 0, over: 0, end: 0, shots: [], foes: [], parts: [], arrowAcc: 0, meteorT: 140,
    p: { x: 60, y: GY, vx: 0, vy: 0, w: 24, h: 56, dir: 1, ground: 0, hp: 100, inv: 0, cd: 0, shootT: 0, safeX: 60, coy: 0, jbuf: 0, jprev: 0 },
    boss: null, bossHp, bossSpawned: 0, pick: 0 };
  if (!window.__keepScore) G.score = 0;
  L.solids.push({ x: L.len, y: -300, w: 40, h: 800, wall: 1 });
  G.coins = L.coins.map(c => ({ ...c, got: 0 })); G.picks = L.picks.map(c => ({ ...c, got: 0 }));
  G.enemies = L.enemies.map(e => ({ ...e }));
}
function rectsHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
const bbox = e => ({ x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h });

function moveBody(e, onlySolid) {
  const L = G.L, g = G.S.g; let hit = { x: 0, ground: 0 };
  e.vy += g; if (e.vy > 12) e.vy = 12;
  e.x += e.vx;
  let b = bbox(e);
  for (const s of L.solids) if (rectsHit(b, s)) { if (e.vx > 0) e.x = s.x - e.w / 2; else if (e.vx < 0) e.x = s.x + s.w + e.w / 2; b = bbox(e); hit.x = 1; }
  const prevBottom = e.y; e.y += e.vy; b = bbox(e); e.ground = 0;
  for (const s of L.solids) if (rectsHit(b, s)) { if (e.vy >= 0) { e.y = s.y; e.ground = 1; } else e.y = s.y + s.h + e.h; e.vy = 0; b = bbox(e); }
  if (e.vy >= 0 && !onlySolid) for (const p of L.plats) if (e.x + e.w / 2 > p.x && e.x - e.w / 2 < p.x + p.w && prevBottom <= p.y + 1 && e.y >= p.y) { e.y = p.y; e.vy = 0; e.ground = 1; }
  return hit;
}

function puff(x, y, col, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = (sp || 3) * (.4 + Math.random()); G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 25 + Math.random() * 15, col, r: 2 + Math.random() * 3 }); } }

function hurtPlayer(d, fromX) {
  const p = G.p; if (p.inv > 0 || G.over) return;
  p.hp -= d; p.inv = 70; sfx.hit(); G.shake = 8; puff(p.x, p.y - 30, '#ff4f4f', 10, 3);
  p.vx = (p.x < fromX ? -1 : 1) * 4.5; p.vy = -5; p.ground = 0;
  if (p.hp <= 0) { p.hp = 0; endGame(0); }
}
function fallInHazard() {
  const p = G.p; if (G.over) return;
  const h = G.S.hazard; puff(p.x, GY, h === 'water' ? '#6fd3ff' : h === 'lava' ? '#ff8a1f' : '#c9c2d8', 14, 4); sfx.hit();
  p.hp -= 25; if (p.hp <= 0) { p.hp = 0; endGame(0); return; }
  p.x = p.safeX; p.y = GY - 110; p.vx = 0; p.vy = 0; p.inv = 100; G.shake = 6;
}

function shoot() {
  const p = G.p, C = G.C; if (p.cd > 0) return;
  p.cd = C.id === 'tejas' ? 26 : 20; p.shootT = 10;
  const x = p.x + p.dir * 26, y = p.y - 38, d = p.dir;
  const base = { x, y, life: 90, hit: new Set(), dmg: C.dmg, from: 'p' };
  if (C.id === 'shiv') G.shots.push({ ...base, type: 'fire', vx: d * 7.5, vy: 0, life: 75 });
  else if (C.id === 'purva') G.shots.push({ ...base, type: 'heart', vx: d * 5.5, vy: 0, life: 95 });
  else if (C.id === 'arya') G.shots.push({ ...base, type: 'snake', vx: d * 5.2, vy: 0, pierce: 1, life: 95 });
  else { G.shots.push({ ...base, type: 'fart', vx: d * 2.6, vy: -.1, pierce: 1, life: 70, max: 70, hitT: new Map(), x: p.x - d * 8, y: p.y - 22 }); sfx.fart(); puff(p.x - d * 14, p.y - 16, '#9ccc4a', 6, 1.5); return; }
  sfx.shoot();
}

function spawnBoss() {
  const C = G.C, si = G.si, rohan = C.boss === 'rohan';
  G.boss = { kind: C.boss, x: 3300, y: GY, vx: 0, vy: 0, dir: -1, hp: G.bossHp, max: G.bossHp, scale: rohan ? 1.55 : 1.45, w: rohan ? 84 : 58, h: rohan ? 150 : 140,
    outfit: si, anim: 0, cd: 80, state: 'idle', st: 0, hurt: 0, moving: 0, axeOut: 0, atkN: 0, hitDone: 0, dead: 0, ground: 1 };
  G.boss.name = rohan ? 'ROHAN' : 'BABLI';
  $('hp2').style.display = 'flex'; $('bface').src = FACES[C.boss]; $('bname').textContent = G.boss.name;
  sfx.boss(); G.shake = 14;

function hostile(type, x, y, vx, vy, dmg, extra) { G.foes.push({ type, x, y, vx, vy, dmg, life: 240, r: 12, ...extra }); }

function updateBoss() {
  const b = G.boss, p = G.p, si = G.si; if (!b) return;
  if (b.dead) { b.dead++; if (b.dead % 6 === 0) puff(b.x + (Math.random() - .5) * 80, b.y - Math.random() * 130, ['#ffd23f', '#ff4f7b', '#fff'][b.dead % 3], 10, 4); if (b.dead === 90 && !G.over) endGame(1); return; }
  b.hurt = Math.max(0, b.hurt - 1);
  const rage = b.hp < b.max * .5 ? 1.35 : 1, sp = (b.kind === 'rohan' ? .85 : 1.05) * (1 + .18 * si) * rage;
  const dx = p.x - b.x; if (b.state === 'idle' || b.state === 'walk') b.dir = dx < 0 ? -1 : 1;
  b.cd--; b.moving = 0;
  const bb = { x: b.x - b.w / 2, y: b.y - b.h, w: b.w, h: b.h }, pb = bbox(p);
  if (b.state === 'idle') {
    const dist = Math.abs(dx);
    if (b.kind === 'rohan') {
      if (dist > 100) { b.vx = b.dir * sp; b.moving = 1; } else b.vx = 0;
      if (b.cd <= 0 && dist < 130) { b.atkN++; b.state = (si > 0 && b.atkN % 3 === 0) ? 'slam' : 'punch'; b.st = 0; b.hitDone = 0; }
    } else {
      if (dist > 150) { b.vx = b.dir * sp; b.moving = 1; } else if (dist < 90) { b.vx = -b.dir * sp * .6; b.moving = 1; } else b.vx = 0;
      if (b.cd <= 0) { if (dist < 120) { b.state = 'swing'; b.st = 0; b.hitDone = 0; } else if (!b.axeOut) { b.state = 'throw'; b.st = 0; } }
    }
  } else if (b.state === 'punch') {
    b.vx = 0; b.st++; b.anim = b.st < 18 ? 0 : Math.min(1, (b.st - 18) / 22);
    if (b.st > 28 && b.st < 38 && !b.hitDone) { const fist = { x: b.dir > 0 ? b.x : b.x - 150, y: b.y - 130, w: 150, h: 110 }; if (rectsHit(pb, fist)) { hurtPlayer(12, b.x); b.hitDone = 1; } }
    if (b.st > 42) { b.state = 'idle'; b.anim = 0; b.cd = 55 / rage; }
  } else if (b.state === 'slam') {
    b.st++; if (b.st === 1) { b.vy = -(G.S.g < .3 ? 6.6 : 12.5); b.ground = 0; b.vx = b.dir * 1.6; sfx.jump(); }
    if (b.st > 6 && b.ground) { b.state = 'idle'; b.vx = 0; b.cd = 60 / rage; G.shake = 14; sfx.stomp(); puff(b.x, GY, '#ffe27a', 16, 4); hostile('shock', b.x - 40, GY, -4.2, 0, 10, { life: 150 }); hostile('shock', b.x + 40, GY, 4.2, 0, 10, { life: 150 }); }
  } else if (b.state === 'swing') {
    b.vx = 0; b.st++; b.anim = b.st < 12 ? 0 : Math.min(1, (b.st - 12) / 16);
    if (b.st > 18 && b.st < 30 && !b.hitDone) { const r = { x: b.dir > 0 ? b.x - 10 : b.x - 130, y: b.y - 150, w: 140, h: 150 }; if (rectsHit(pb, r)) { hurtPlayer(12, b.x); b.hitDone = 1; } }
    if (b.st > 34) { b.state = 'idle'; b.anim = 0; b.cd = 50 / rage; }
  } else if (b.state === 'throw') {
    b.vx = 0; b.st++; b.anim = Math.min(1, b.st / 14) * .6;
    if (b.st === 16) { b.axeOut = 1; b.anim = 0; sfx.shoot(); hostile('axe', b.x + b.dir * 30, b.y - 80, b.dir * 6.2, 0, 12, { rot: 0, ph: 0, life: 400, r: 22, back: 0 }); }
    if (b.st > 22) { b.state = 'idle'; b.cd = 65 / rage; }
  }
  b.vy += G.S.g; if (b.vy > 12) b.vy = 12;
  b.x += b.vx; b.x = Math.max(G.L.wall + 60, Math.min(G.L.len - 50, b.x));
  b.y += b.vy; if (b.y >= GY) { b.y = GY; b.vy = 0; b.ground = 1; }
  if (rectsHit(pb, { x: b.x - b.w / 2 + 8, y: b.y - b.h + 20, w: b.w - 16, h: b.h - 20 }) && b.state !== 'slam') hurtPlayer(8, b.x);
}

function damageBoss(d) {
  const b = G.boss; if (!b || b.dead) return; b.hp -= d; b.hurt = 10; sfx.stomp(); G.score += 20;
  if (b.hp <= 0) { b.hp = 0; b.dead = 1; G.score += 1000; sfx.win(); G.shake = 20; G.foes = []; }
}

/* ===== Per-frame update ===== */
function updatePlayer() {
  const p = G.p, S = G.S, L = G.L;
  const dir = (key.r ? 1 : 0) - (key.l ? 1 : 0);
  p.vx += (dir * 3.6 - p.vx) * (p.ground ? .3 : .16); if (dir) p.dir = dir;
  if (p.inv > 0) p.inv--; if (p.cd > 0) p.cd--; if (p.shootT > 0) p.shootT--;
  p.coy = p.ground ? 7 : p.coy - 1;
  if (key.j && !p.jprev) p.jbuf = 8; p.jprev = key.j; if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && p.coy > 0) { p.vy = -S.jv; p.jbuf = 0; p.coy = 0; p.ground = 0; sfx.jump(); }
  if (!key.j && p.vy < -S.jv * .35) p.vy += S.g * 1.2;
  if (key.a) shoot();
  moveBody(p);
  p.x = Math.max(14, p.x);
  if (p.ground) for (const s of L.segs) if (p.x > s[0] + 50 && p.x < s[1] - 50 && Math.abs(p.y - GY) < 2) p.safeX = p.x;
  if (!G.bossSpawned && p.x > ARENA) { G.bossSpawned = 1; L.solids.push({ x: L.wall - 40, y: -300, w: 40, h: 800, wall: 1 }); spawnBoss(); }
  if (p.y > GY + 80) fallInHazard();
  const pb = bbox(p);
  for (const s of L.spikes) if (rectsHit(pb, s)) hurtPlayer(10, s.x + s.w / 2);
  for (const c of G.coins) if (!c.got && Math.abs(c.x - p.x) < 24 && Math.abs(c.y - (p.y - 28)) < 36) { c.got = 1; G.score += 10; sfx.coin(); puff(c.x, c.y, '#ffd23f', 6, 2); }
  for (const c of G.picks) if (!c.got && Math.abs(c.x - p.x) < 26 && Math.abs(c.y - (p.y - 28)) < 36) { c.got = 1; p.hp = Math.min(100, p.hp + 30); sfx.coin(); puff(c.x, c.y, '#ff4f7b', 10, 3); }
}

function killEnemy(e) { e.dead = 1; G.score += 100; sfx.stomp(); puff(e.x, e.y - 14, ['#ffd23f', '#fff', '#ff4f7b'][Math.floor(Math.random() * 3)], 12, 3.5); }

function updateEnemies() {
  const p = G.p, L = G.L, t = G.t;
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (Math.abs(e.x - p.x) > 700) continue;
    if (e.kind === 'walker') {
      e.vx = e.dir * .9; const h = moveBody(e, true);
      const ax = e.x + e.dir * 20; let solid = 0; for (const s of L.solids) if (ax > s.x && ax < s.x + s.w && e.y + 6 > s.y && e.y + 6 < s.y + s.h) solid = 1;
      if (h.x || (!solid && e.ground)) e.dir *= -1;
    } else { e.x += e.dir * 1.1; if (Math.abs(e.x - e.x0) > 140) e.dir *= -1; e.y = e.y0 + Math.sin(t * .05 + e.ph) * 18; }
    const eb = bbox(e), pb = bbox(p);
    if (e.kind === 'fly') { eb.y -= 4; }
    if (rectsHit(pb, eb)) {
      if (p.vy > 0.5 && p.y - 6 < e.y - e.h * .5) { killEnemy(e); p.vy = -G.S.jv * .75; p.ground = 0; } else hurtPlayer(10, e.x);
    }
  }
}

function updateShots() {
  const p = G.p, L = G.L, b = G.boss;
  for (const s of G.shots) {
    if (s.type === 'heart') {
      let best = null, bd = 240;
      for (const e of G.enemies) if (!e.dead) { const d = Math.hypot(e.x - s.x, e.y - 20 - s.y); if (d < bd && (e.x - s.x) * s.vx > 0) { bd = d; best = { x: e.x, y: e.y - 20 }; } }
      if (b && !b.dead) { const d = Math.hypot(b.x - s.x, b.y - 70 - s.y); if (d < bd && (b.x - s.x) * s.vx > 0) { bd = d; best = { x: b.x, y: b.y - 70 }; } }
      if (best) s.vy += Math.sign(best.y - s.y) * .25; s.vy = Math.max(-2.5, Math.min(2.5, s.vy)); if (!best) s.vy *= .9;
    }
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.type === 'fart') { s.vx *= .985; }
    const sr = s.type === 'fart' ? 22 : s.type === 'snake' ? 14 : 10, sb = { x: s.x - sr, y: s.y - sr, w: sr * 2, h: sr * 2 };
    for (const e of G.enemies) if (!e.dead && rectsHit(sb, bbox(e))) {
      if (s.type === 'fart') { const last = s.hitT.get(e) || -99; if (G.t - last < 15) continue; s.hitT.set(e, G.t); }
      else if (s.hit.has(e)) continue; else s.hit.add(e);
      killEnemy(e); if (!s.pierce) s.life = 0;
    }
    if (b && !b.dead && rectsHit(sb, { x: b.x - b.w / 2, y: b.y - b.h, w: b.w, h: b.h })) {
      if (s.type === 'fart') { const last = s.hitT.get(b) || -99; if (G.t - last >= 15) { s.hitT.set(b, G.t); damageBoss(s.dmg); puff(s.x, s.y, '#9ccc4a', 6, 2); } }
      else if (!s.hit.has(b)) { s.hit.add(b); damageBoss(s.dmg); puff(s.x, s.y, s.type === 'fire' ? '#ff8a1f' : s.type === 'heart' ? '#ff3b7a' : '#4fd04a', 10, 3); if (!s.pierce) s.life = 0; }
    }
    if (s.type !== 'fart') for (const q of L.solids) if (s.x > q.x && s.x < q.x + q.w && s.y > q.y && s.y < q.y + q.h) { s.life = 0; puff(s.x, s.y, '#fff', 4, 2); }
    if (s.x < G.cam - 60 || s.x > G.cam + W + 60) s.life = 0;
  }
  G.shots = G.shots.filter(s => s.life > 0);
}

function updateFoes() {
  const p = G.p, L = G.L, b = G.boss, pb = bbox(p);
  for (const f of G.foes) {
    f.life--;
    if (f.type === 'axe') {
      f.rot += .45; f.ph++;
      if (!b || b.dead) { f.life = 0; continue; }
      if (f.ph > 42) { const tx = b.x, ty = b.y - 80, d = Math.hypot(tx - f.x, ty - f.y) || 1; f.vx = (tx - f.x) / d * 7.5; f.vy = (ty - f.y) / d * 7.5; if (d < 34) { f.life = 0; b.axeOut = 0; } }
      else f.vy = (p.y - 40 - f.y) * .02;
    } else if (f.type === 'meteor') { f.vy += .03; }
    f.x += f.vx; f.y += f.vy;
    let box;
    if (f.type === 'arrow' || f.type === 'laser') box = { x: f.x - 18, y: f.y - 4, w: 36, h: 8 };
    else if (f.type === 'shock') box = { x: f.x - 10, y: f.y - 32, w: 20, h: 32 };
    else box = { x: f.x - f.r, y: f.y - f.r, w: f.r * 2, h: f.r * 2 };
    if (rectsHit(pb, box)) { hurtPlayer(f.dmg, f.x); if (f.type !== 'shock' && f.type !== 'axe') f.life = 0; }
    if (f.type === 'arrow' || f.type === 'laser') for (const q of L.solids) if (f.x > q.x && f.x < q.x + q.w && f.y > q.y && f.y < q.y + q.h && !q.turret) { f.life = 0; puff(f.x, f.y, '#fff', 4, 2); }
    if (f.type === 'meteor' && f.y > GY - f.r) { f.life = 0; puff(f.x, GY, '#c9c2d8', 14, 4); G.shake = 5; }
    if (f.type === 'shock' && (f.x < L.wall || f.x > L.len)) f.life = 0;
    if (f.x < G.cam - 120 || f.x > G.cam + W + 120) { if (f.type !== 'axe') f.life = 0; }
  }
  G.foes = G.foes.filter(f => { if (f.life <= 0 && f.type === 'axe' && G.boss) G.boss.axeOut = 0; return f.life > 0; });
}

function updateWorld() {
  G.t++;
  const L = G.L, p = G.p;
  updatePlayer();
  if (G.over) return;
  updateEnemies(); updateShots(); updateFoes(); updateBoss();
  for (const q of L.turrets) {
    q.t++; if (q.t >= q.per) { q.t = 0; if (Math.abs(q.x - (G.cam + 400)) < 480) { if (q.type === 'laser') { hostile('laser', q.x - 10, q.y, -7.5, 0, 10); beep(520, .1, 'sawtooth', .03, .3); } else { hostile('arrow', q.x - 10, q.y, -5.4, 0, 10); beep(260, .08, 'triangle', .05, .5); } puff(q.x - 8, q.y, '#fff', 3, 1.5); } }
  }
  if (G.si === 2 && !G.boss) { G.meteorT--; if (G.meteorT <= 0) { G.meteorT = 110 + Math.random() * 90; const mx = Math.min(ARENA - 80, p.x + 60 + Math.random() * 320); hostile('meteor', mx, -30, -.9, 2.5, 12, { r: 14 }); } }
  for (const q of G.parts) { q.x += q.vx; q.y += q.vy; q.vy += .14; q.life--; }
  G.parts = G.parts.filter(q => q.life > 0);
  const target = Math.max(0, Math.min(L.len - W, p.x - 300 + p.dir * 40));
  G.cam += (target - G.cam) * .12; if (G.shake > 0) G.shake *= .86;
  if (G.boss && G.cam < L.len - W - 1 && G.bossSpawned) G.cam = Math.min(L.len - W, G.cam + 8);
}

function endGame(win) {
  G.over = win ? 2 : 1; key.l = key.r = key.j = key.a = 0;
  setTimeout(() => {
    hideAll(); $('ctl').classList.remove('on');
    if (!win) { $('overt').textContent = 'Oops, you lost!'; $('overs').textContent = 'Score ' + G.score + '. Give it another go.'; show('over'); }
    else if (G.si < 2) { $('clrt').textContent = 'Stage ' + (G.si + 1) + ' clear!'; $('clrs').textContent = G.boss.name + ' is down. Score ' + G.score + '. Next up: ' + STAGES[G.si + 1].name + ' (' + ['Normal clothes', 'Armour', 'Space suit'][G.si + 1] + ').'; $('next').textContent = 'NEXT STAGE'; show('clear'); }
    else { $('clrt').textContent = 'You beat Taps Simulator!'; $('clrs').textContent = 'All 3 bosses defeated. Final score ' + G.score + '.'; $('next').textContent = 'PLAY AGAIN'; show('clear'); }
  }, win ? 600 : 700);
}

/* ===== Rendering ===== */

    ctx.beginPath(); ctx.arc(660, 70, 36, 0, 7); ctx.fillStyle = '#fff3a0'; ctx.fill(); ctx.beginPath(); ctx.arc(660, 70, 28, 0, 7); ctx.fillStyle = '#ffd23f'; ctx.fill();

    for (let i = 0; i < 9; i++) { const x = ((i * 330 - cam * .6) % 2400 + 2400) % 2400 - 150; ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 14, 258, 12, 40); ctx.beginPath(); ctx.arc(x + 20, 252, 28, 0, 7); ctx.fillStyle = '#2f9e44'; ctx.fill(); outline(3); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 12, 244, 6, 0, 7); ctx.fillStyle = '#ff5a5a'; ctx.fill(); }
  } else if (si === 1) {

    for (let i = 0; i < 6; i++) { const x = ((i * 300 + 150 - cam * .5) % 1800 + 1800) % 1800 - 100; ctx.fillStyle = '#3b2a22'; ctx.fillRect(x - 3, 185, 6, 30); const fl = Math.sin(t * .3 + i) * 3; ctx.beginPath(); ctx.ellipse(x, 176, 8, 15 + fl, 0, 0, 7); ctx.fillStyle = '#ff8a1f'; ctx.fill(); ctx.beginPath(); ctx.ellipse(x, 180, 4, 9 + fl, 0, 0, 7); ctx.fillStyle = '#ffe27a'; ctx.fill(); }
    const lg = ctx.createLinearGradient(0, 300, 0, H); lg.addColorStop(0, '#ff6a3d00'); lg.addColorStop(1, '#ff6a3d55'); ctx.fillStyle = lg; ctx.fillRect(0, 300, W, 100);
  } else {
    ctx.fillStyle = '#090618'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b0a2a'); g.addColorStop(1, '#2a2050'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of STARS) { const x = ((s.x - cam * .05) % 800 + 800) % 800; ctx.globalAlpha = .5 + .5 * Math.sin(t * .05 + s.x); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
    const ex = 560 - cam * .03; ctx.beginPath(); ctx.arc(ex, 100, 54, 0, 7); ctx.fillStyle = '#2b82e0'; ctx.fill(); ctx.save(); ctx.clip(); ctx.fillStyle = '#4cc552'; ctx.beginPath(); ctx.ellipse(ex - 18, 90, 20, 14, .4, 0, 7); ctx.ellipse(ex + 20, 120, 16, 20, -.3, 0, 7); ctx.fill(); ctx.fillStyle = '#ffffffaa'; ctx.beginPath(); ctx.ellipse(ex + 10, 78, 26, 7, 0, 0, 7); ctx.fill(); ctx.restore(); ctx.beginPath(); ctx.arc(ex, 100, 54, 0, 7); outline(4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 280 - Math.sin((x + cam * .3) * .01) * 24 - Math.sin((x + cam * .3) * .031) * 8); ctx.lineTo(W, H); ctx.fillStyle = '#3a3358'; ctx.fill();

function drawHazards(L, si, cam, t) {
  for (const g of L.gaps) {
    const x = g[0], w = g[1] - g[0]; if (x > cam + W + 20 || g[1] < cam - 20) continue;
    if (si === 0) { ctx.fillStyle = '#2d9cdb'; ctx.fillRect(x, GY + 6, w, H); ctx.beginPath(); ctx.moveTo(x, GY + 6); for (let i = 0; i <= w; i += 10) ctx.lineTo(x + i, GY + 6 + Math.sin(t * .1 + (x + i) * .09) * 4); ctx.lineTo(x + w, H); ctx.lineTo(x, H); ctx.fillStyle = '#5cc8ff'; ctx.fill(); ctx.fillStyle = '#ffffff88'; for (let i = 0; i < w; i += 30) ctx.fillRect(x + i + (t * .5 % 30), GY + 14, 12, 3); }
    else if (si === 1) { const lg = ctx.createLinearGradient(0, GY, 0, H); lg.addColorStop(0, '#ffd23f'); lg.addColorStop(.4, '#ff8a1f'); lg.addColorStop(1, '#c1260f'); ctx.fillStyle = lg; ctx.fillRect(x, GY + 6, w, H); ctx.beginPath(); ctx.moveTo(x, GY + 6); for (let i = 0; i <= w; i += 10) ctx.lineTo(x + i, GY + 4 + Math.sin(t * .08 + (x + i) * .1) * 4); ctx.lineTo(x + w, H); ctx.lineTo(x, H); ctx.fillStyle = '#ffb02a'; ctx.fill(); for (let i = 0; i < 3; i++) { const bx = x + ((t * .7 + i * 47 + x) % w), by = GY + 20 + Math.sin(t * .1 + i) * 8; ctx.beginPath(); ctx.arc(bx, by, 5, 0, 7); ctx.fillStyle = '#ffe27a'; ctx.fill(); } }
    else { const cg = ctx.createLinearGradient(0, GY, 0, H); cg.addColorStop(0, '#15102e'); cg.addColorStop(1, '#000'); ctx.fillStyle = cg; ctx.fillRect(x, GY, w, H); ctx.fillStyle = '#fff8'; for (let i = 0; i < 5; i++) ctx.fillRect(x + 10 + (i * 53) % (w - 10), GY + 20 + (i * 37) % 40, 2, 2); }
  }
}

function drawSolid(s, si, t) {
  if (s.x > G.cam + W + 20 || s.x + s.w < G.cam - 20 || s.wall) return;
  if (s.ground) {
    const top = ['#4cc552', '#6e6a80', '#b9b4c9'][si], body = ['#a0642e', '#4a4660', '#7d7794'][si], dark = ['#7a4a22', '#34304a', '#5d5774'][si];
    ctx.fillStyle = body; ctx.fillRect(s.x, GY, s.w, 120);
    ctx.fillStyle = dark; for (let i = 0; i < s.w; i += 46) { ctx.beginPath(); ctx.arc(s.x + i + 14 + (i * 7) % 20, GY + 40 + (i * 13) % 40, 4 + (i % 3), 0, 7); ctx.fill(); }
    if (si === 1) { outline(2); for (let i = 0; i < s.w; i += 50) { ctx.strokeRect(s.x + i, GY + 14, 50, 26); ctx.strokeRect(s.x + i + 25, GY + 40, 50, 26); } }
    ctx.fillStyle = top; rr(s.x - 2, GY - 4, s.w + 4, 18, 8); ctx.fill(); outline(3.5); ctx.stroke();
    if (si === 0) { ctx.fillStyle = '#7ee07a'; for (let i = 0; i < s.w; i += 24) { ctx.beginPath(); ctx.moveTo(s.x + i, GY - 3); ctx.lineTo(s.x + i + 4, GY - 10); ctx.lineTo(s.x + i + 8, GY - 3); ctx.fill(); } }
    if (si === 2) { ctx.fillStyle = '#9a94b0'; for (let i = 0; i < s.w; i += 90) { ctx.beginPath(); ctx.ellipse(s.x + i + 40, GY + 6, 22, 4, 0, 0, 7); ctx.fill(); } }
    ctx.strokeStyle = '#2a1a4a'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(s.x, GY + 14); ctx.lineTo(s.x, H); ctx.moveTo(s.x + s.w, GY + 14); ctx.lineTo(s.x + s.w, H); ctx.stroke();
  } else if (s.turret) {
    ctx.beginPath(); rr(s.x, s.y, s.w, s.h, 6); fillStroke(si === 1 ? '#555066' : '#8a96b0', 3.5);
    ctx.beginPath(); rr(s.x - 12, s.y + 14, 28, 14, 5); fillStroke('#2a2438', 3); ctx.beginPath(); ctx.arc(s.x - 12, s.y + 21, 4, 0, 7); ctx.fillStyle = si === 2 ? '#ff2a6a' : '#ff8a1f'; ctx.fill();
    ctx.beginPath(); ctx.arc(s.x + s.w / 2 + 4, s.y + 34, 5, 0, 7); fillStroke('#ffd23f', 2);
  } else {
    ctx.beginPath(); rr(s.x, s.y, s.w, s.h, si === 2 ? 12 : 4);
    fillStroke(['#d99a4e', '#7c7794', '#a49cba'][si], 3.5);
    if (si === 0) { outline(2.5); ctx.beginPath(); ctx.moveTo(s.x + 6, s.y + 6); ctx.lineTo(s.x + s.w - 6, s.y + s.h - 6); ctx.moveTo(s.x + s.w - 6, s.y + 6); ctx.lineTo(s.x + 6, s.y + s.h - 6); ctx.stroke(); }
    else if (si === 1) { outline(2); ctx.beginPath(); ctx.moveTo(s.x, s.y + s.h / 2); ctx.lineTo(s.x + s.w, s.y + s.h / 2); ctx.moveTo(s.x + s.w / 2, s.y); ctx.lineTo(s.x + s.w / 2, s.y + s.h / 2); ctx.stroke(); }
    else { ctx.fillStyle = '#6e6788'; ctx.beginPath(); ctx.arc(s.x + 12, s.y + 14, 5, 0, 7); ctx.arc(s.x + s.w - 12, s.y + s.h - 12, 4, 0, 7); ctx.fill(); }
  }
}

function drawSpike(s, si) {
  const n = Math.max(2, Math.round(s.w / 14));
  for (let i = 0; i < n; i++) { const x = s.x + i * (s.w / n), w = s.w / n; ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + w / 2, GY - 24 - (i % 2) * 6); ctx.lineTo(x + w, GY); ctx.closePath(); fillStroke(['#2f9e44', '#cfd6e4', '#b46cff'][si], 3); }
  if (si === 0) { ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(s.x + s.w * .3, GY - 8, 3, 0, 7); ctx.arc(s.x + s.w * .7, GY - 12, 3, 0, 7); ctx.fill(); }
}

function drawPlat(p, si) {
  ctx.beginPath(); rr(p.x, p.y, p.w, 16, 7); fillStroke(['#a0642e', '#6e6a80', '#aab4c4'][si], 3.5);
  ctx.beginPath(); rr(p.x, p.y, p.w, 7, 4); fillStroke(['#4cc552', '#8a85a0', '#e8eefc'][si], 3);
}

function drawCoin(c, t) { const w = Math.abs(Math.cos(t * .06 + c.x)); ctx.beginPath(); ctx.ellipse(c.x, c.y, 8 * w + 1.5, 9, 0, 0, 7); fillStroke('#ffd23f', 2.5); ctx.beginPath(); ctx.ellipse(c.x, c.y, 3 * w, 5, 0, 0, 7); ctx.fillStyle = '#fff6b0'; ctx.fill(); }
function drawPick(c, t) { const y = c.y + Math.sin(t * .08) * 3; ctx.save(); ctx.translate(c.x, y); ctx.scale(1.3, 1.3); ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-18, -3, -9, -17, 0, -7); ctx.bezierCurveTo(9, -17, 18, -3, 0, 9); fillStroke('#ff3b7a', 3); ctx.fillStyle = '#fff'; ctx.font = '900 9px Nunito'; ctx.textAlign = 'center'; ctx.fillText('+', 0, 0); ctx.restore(); }

function render() {
  const si = G.si, L = G.L, cam = G.cam, t = G.t;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  drawBG(si, cam, t);
  const sh = G.shake; ctx.translate(-cam + (sh ? (Math.random() - .5) * sh : 0), sh ? (Math.random() - .5) * sh : 0);
  drawHazards(L, si, cam, t);
  for (const s of L.solids) drawSolid(s, si, t);
  for (const p of L.plats) drawPlat(p, si);
  for (const s of L.spikes) drawSpike(s, si);
  for (const c of G.coins) if (!c.got) drawCoin(c, t);
  for (const c of G.picks) if (!c.got) drawPick(c, t);
  for (const e of G.enemies) if (!e.dead && Math.abs(e.x - cam - 400) < 520) drawEnemy(e, t, si);
  if (G.boss) drawBoss(G.boss, t);
  const p = G.p;
  if (!G.over || G.over === 2) drawHero(G.C, p.x, p.y, G.S.outfit, p.dir, t, Math.abs(p.vx) > .5, !p.ground, p.shootT > 0, p.inv);
  for (const s of G.shots) drawShot(s, t);
  for (const f of G.foes) { if (f.type === 'axe') drawAxe({ x: f.x, y: f.y, rot: f.rot }, t); else drawShot(f, t); }
  for (const q of G.parts) { ctx.globalAlpha = Math.min(1, q.life / 15); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  ctx.restore();
  // hud
  $('hpbar').style.width = p.hp + '%';
  if (G.boss) $('bbar').style.width = (G.boss.hp / G.boss.max * 100) + '%';
  $('info').textContent = 'Stage ' + (si + 1) + '  ' + G.S.name + '   Score ' + G.score;
}

/* ===== Screens and main loop ===== */
let mode = 'menu', chosen = 0, paused = false;
const screens = ['menu', 'select', 'intro', 'pause', 'over', 'clear'];
function hideAll() { screens.forEach(s => $(s).classList.remove('on')); }
function show(s) { hideAll(); $(s).classList.add('on'); }
function hudOn(on) { $('hud').classList.toggle('on', on); $('ctl').classList.toggle('on', on); $('pbtn').style.display = on ? 'block' : 'none'; if (!on) $('hp2').style.display = 'none'; }

const TAGS = { rohan: ['Fights ROHAN', '#d1481f'], babli: ['Fights BABLI', '#7a3cff'] };
CHARS.forEach((c, i) => {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<img alt="" src="' + FACES[c.id] + '"><b>' + c.name + '</b><i>' + c.atk + ': ' + c.desc + '</i><span class="tag" style="background:' + TAGS[c.boss][1] + '">' + TAGS[c.boss][0] + '</span>';
  d.addEventListener('click', () => { initAudio(); chosen = i; d.classList.add('pick'); window.__keepScore = false; setTimeout(() => { d.classList.remove('pick'); startStage(i, 0); }, 160); });
  $('cards').appendChild(d);
});

function startStage(ci, si) {
  newGame(ci, si);
  const C = CHARS[ci], S = STAGES[si];
  $('hpface').src = FACES[C.id];
  $('introin').innerHTML = '<img alt="" src="' + FACES[C.id] + '"><h2 style="margin-top:' + 8 + 'px">Stage ' + (si + 1) + ': ' + S.name + '</h2><p class="sub">' + S.sub + '<br>' + C.name + ' wears: ' + ['normal clothes', 'shiny armour', 'a space suit'][si] + '</p><button class="btn" id="go">GO!</button>';
  hudOn(false); show('intro'); mode = 'intro';
  $('go').addEventListener('click', () => { initAudio(); hideAll(); hudOn(true); mode = 'play'; paused = false; });
}
$('start').addEventListener('click', () => { initAudio(); show('select'); mode = 'select'; });
$('back').addEventListener('click', () => { show('menu'); mode = 'menu'; });
$('again').addEventListener('click', () => { window.__keepScore = false; startStage(G.ci, G.si); });
$('next').addEventListener('click', () => {
  if (G.si < 2) { window.__keepScore = true; const sc = G.score; startStage(G.ci, G.si + 1); G.score = sc; window.__keepScore = false; }
  else { show('select'); mode = 'select'; }
});
function toMenu() { hudOn(false); show('menu'); mode = 'menu'; paused = false; }
$('quit').addEventListener('click', toMenu); $('quit2').addEventListener('click', toMenu);
function pauseGame() { if (mode !== 'play' || G.over) return; paused = true; key.l = key.r = key.j = key.a = 0; show('pause'); }
$('pbtn').addEventListener('click', pauseGame);
$('resume').addEventListener('click', () => { paused = false; hideAll(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* menu backdrop: gentle idle scene */
function menuScene(t) {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  G0.t = t; drawBG(0, t * .5, t);
  ctx.fillStyle = '#4cc552'; ctx.fillRect(0, GY, W, 60); ctx.fillStyle = '#a0642e'; ctx.fillRect(0, GY + 14, W, 60);
  ctx.beginPath(); rr(-4, GY - 4, W + 8, 18, 8); fillStroke('#4cc552', 3.5);
  const hs = [[110, 0, 'shiv'], [200, 1, 'purva'], [600, 2, 'arya'], [690, 2, 'tejas']];
  hs.forEach(([x, o, id], i) => { const c = CHARS.find(q => q.id === id); const jump = Math.abs(Math.sin(t * .04 + i * 1.3)) * 30; drawHero(c, x, GY - jump, [0, 1, 2, 0][i], i < 2 ? 1 : -1, t, 0, jump > 4, 0, 0); });
  ctx.restore();
}
const G0 = { t: 0 };
let last = 0, acc = 0, mt = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, ts - last || 16); last = ts;
  if (mode === 'play' && !paused && G) {
    acc += dt; let n = 0;
    while (acc >= 16.67 && n < 4) { updateWorld(); acc -= 16.67; n++; } if (n === 4) acc = 0;
    render();
  } else if (mode === 'play' || mode === 'intro') { if (G) render(); }
  else { mt++; menuScene(mt); }
}
requestAnimationFrame(frame);


</script>
